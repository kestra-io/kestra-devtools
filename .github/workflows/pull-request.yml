name: kestra-devtools pull request

on:
  pull_request:

env:
  # to save corepack from itself
  COREPACK_INTEGRITY_KEYS: 0

jobs:
  test:
    name: kestra-devtools tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm version

      - name: Npm - install
        run: npm ci

      - name: Run tests
        run: npm run test

      # The tests run the TypeScript sources, not the bundle: load the built CLI too
      # (1.0.44 shipped a bundle that crashed at load time with green tests).
      - name: Build and load the CLI bundle
        run: |
          npm run build
          node dist/kestra-devtools.cjs --help
